[package]
name = "prepare"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
crossbeam-channel = "0.5"
flate2 = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
mimalloc = "0.1"
rustc-hash = "2.1.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_repr = "0.1"
simd-json = { version = "0.15", features = ["serde_impl"] }
snap = "1.1"
walkdir = "2.5"

[profile.release]
lto = "thin"
codegen-units = 1
